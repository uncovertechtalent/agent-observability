# Modules for the lan-* jobs in prometheus/prometheus.yml. The targets come from prometheus/targets.
modules:
  icmp:
    prober: icmp
    timeout: 4s
    icmp:
      preferred_ip_protocol: ip4
  # Asks the DNS server (the target) for a real name and wants an A record back. The name's TTL is
  # short, so a probe a minute apart regularly reaches the upstream resolver.
  dns_a:
    prober: dns
    timeout: 4s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      query_name: github.com
      query_type: A
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - '\sA\s\d+\.\d+\.\d+\.\d+$'
  tcp_connect:
    prober: tcp
    timeout: 4s
    tcp:
      preferred_ip_protocol: ip4
