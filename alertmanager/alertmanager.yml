# One Alertmanager for two Prometheus servers: this stack's (external label
# prometheus="agent-observability") and the NAS monitoring stack's (prometheus="nas"), which
# sends here over the LAN. Severity picks the receiver:
#
#   page    the pager: an incident on the private Discord server with Acknowledge, Resolve and
#           Escalate buttons; who is on call and when it escalates come from pager/rotation.yml.
#           Every page is also a ticket.
#   ticket  alert-issues (one GitHub issue per alert on the board) and the pager's #tickets
#   info    nowhere
#
# The alerting path watches itself apart from the pager: a down or disconnected pager and a
# failed delivery go to #watchdog by webhook and to the board, never through the pager. Watchdog
# always fires; each Prometheus's Watchdog goes through the pager, which pings that Prometheus's
# outside heartbeat check every 5 minutes with an empty request, so Alertmanager's JSON stays in
# the house. The check alarms when the pings stop: a down pager stops them too.
#
# Secrets are files in ./secrets (mode 600, git-ignored, never in this file):
#   web.yml                             basic auth on every endpoint, one bcrypt user per
#                                       Prometheus (agent-observability, nas)
#   discord_webhook_url                 the #watchdog channel's webhook
# The heartbeat ping URLs are the pager's (pager/secrets/heartbeat_url_<name>).
#
# Tests: scripts/check-alerting.sh (amtool routes for every rule's severity).

global:
  resolve_timeout: 5m

route:
  receiver: board              # anything no route below matches becomes a ticket
  group_by: [alertname, prometheus]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    # First, so it never reaches a person: only the heartbeat checks get it.
    - matchers: [alertname="Watchdog"]
      receiver: blackhole
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
      routes:
        - matchers: [prometheus="agent-observability"]
          receiver: heartbeat-agent-observability
        - matchers: [prometheus="nas"]
          receiver: heartbeat-nas

    # The alerting path itself, past the pager: it cannot report its own outage.
    - matchers: [alertname=~"PagerDown|PagerDisconnected|PagerFailing|AlertmanagerNotificationsFailing"]
      receiver: alerting-path
      group_wait: 0s
      repeat_interval: 1h

    # The three AWS spend rules are a showcase: they evaluate and show their state on the AWS
    # spend dashboard, and nothing delivers them (operator's call, 2026-10-09). Delete this route
    # to deliver them as tickets. AWSCostExporterStale is exporter health, and stays a ticket.
    - matchers: [alertname=~"AWSCost(ForecastOverBudget|MonthToDateOver80|DailySpike)"]
      receiver: blackhole

    - matchers: [severity="info"]
      receiver: blackhole

    # The pager dedups by fingerprint, so an hourly repeat only refreshes the open incident.
    - matchers: [severity="page"]
      receiver: pager
      group_wait: 10s
      group_interval: 1m       # a resolve or a new alert in the group reaches the pager within a minute
      repeat_interval: 1h
      continue: true           # and the next route: every page is also a ticket

    - matchers: [severity=~"page|ticket"]
      receiver: board

# One cause, one alert: a down Ollama silences the SLO burns and symptoms behind it, a down
# SearXNG the engine, latency and egress alerts, a down pager its disconnect. Only within the
# same Prometheus. An alert that resolves while inhibited sends no resolve; alert-issues sweeps
# such issues closed after 25 hours.
inhibit_rules:
  - source_matchers: [alertname="OllamaDown"]
    target_matchers: [alertname=~"LocalLLM.+|ModelSpilledToCPU|OllamaExporterDown"]
    equal: [prometheus]
  - source_matchers: [alertname="SearXNGDown"]
    target_matchers: [alertname=~"SearXNG.+"]
    equal: [prometheus]
  - source_matchers: [alertname="PagerDown"]
    target_matchers: [alertname="PagerDisconnected"]
    equal: [prometheus]
  # A power cut restarts every host and device at once: one ticket for the outage, not one per device.
  - source_matchers: [alertname="LANMassReboot"]
    target_matchers: [alertname=~"HostRebooted|UniFiDeviceRebooted"]
    equal: [prometheus]
  # Both Prometheus servers probe the hosts that matter most. The NAS server's alert wins; the other
  # stack's copy speaks only when the NAS server is silent, for example because its host is down.
  - source_matchers: [prometheus="nas", alertname=~"LANHostDown|LANDNSDown|LANDNSSecondaryDown|LANUpstreamDNSDown"]
    target_matchers: [prometheus="agent-observability", alertname=~"LANHostDown|LANDNSDown|LANDNSSecondaryDown|LANUpstreamDNSDown"]
    equal: [alertname, name]
  # A DNS server that answers nothing also fails the upstream probe: one ticket for it, from the local alert.
  - source_matchers: [alertname=~"LANDNSDown|LANDNSSecondaryDown"]
    target_matchers: [alertname="LANUpstreamDNSDown"]
    equal: [prometheus, name]

receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:9096/alerts/page
        send_resolved: true

  - name: board
    webhook_configs:
      - url: http://alert-issues:9095/alerts
        send_resolved: true
      - url: http://pager:9096/alerts/ticket
        send_resolved: true

  - name: alerting-path
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        username: Alerting path      # instead of the webhook's default name
        send_resolved: true
    webhook_configs:
      - url: http://alert-issues:9095/alerts
        send_resolved: true

  - name: heartbeat-agent-observability
    webhook_configs:
      - url: http://pager:9096/heartbeat/agent-observability
        send_resolved: false

  - name: heartbeat-nas
    webhook_configs:
      - url: http://pager:9096/heartbeat/nas
        send_resolved: false

  - name: blackhole
