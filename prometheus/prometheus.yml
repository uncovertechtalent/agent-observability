global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Names this server on every alert it sends. The NAS Prometheus, which uses the same
  # Alertmanager, sends prometheus="nas".
  external_labels:
    prometheus: agent-observability

# Severity routes in alertmanager/alertmanager.yml: page to Discord, ticket to a GitHub issue.
# Alertmanager wants basic auth; the password file is readable by the container user only.
alerting:
  alertmanagers:
    - basic_auth:
        username: agent-observability
        password_file: /etc/prometheus/secrets/alertmanager_password
      static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - rules/*.yml

# OTLP push from Alloy. Resource attributes become labels only when promoted;
# the rest stay on target_info, which keeps per-series cardinality down.
otlp:
  promote_resource_attributes:
    - service.name
    - service.version
    - host.name
  translation_strategy: UnderscoreEscapingWithSuffixes

storage:
  tsdb:
    # OTLP batches can arrive late; accept up to 30 minutes out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ollama-exporter
    static_configs:
      - targets: ["ollama-exporter:11435"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # The ticket receiver: when its GitHub token expires.
  - job_name: alert-issues
    static_configs:
      - targets: ["alert-issues:9095"]

  # The Discord pager: connected or not, open and unacknowledged incidents.
  - job_name: pager
    static_configs:
      - targets: ["pager:9096"]

  - job_name: alertmanager
    basic_auth:
      username: agent-observability
      password_file: /etc/prometheus/secrets/alertmanager_password
    static_configs:
      - targets: ["alertmanager:9093"]

  # Host and GPU exporters on the machine that runs Ollama.
  # Remove these jobs if the host has no node_exporter or nvidia_gpu_exporter.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: nvidia-gpu
    static_configs:
      - targets: ["host.docker.internal:9835"]

  # Per-container CPU, memory, network and disk from cAdvisor.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Website deploys (GitHub Actions) and the gate, map and probe state they publish.
  - job_name: deploy-exporter
    scrape_interval: 60s
    static_configs:
      - targets: ["deploy-exporter:9201"]

  # AWS spend (Cost Explorer, AWS Budgets). The exporter caches; scraping it costs nothing.
  - job_name: aws-cost-exporter
    scrape_interval: 60s
    static_configs:
      - targets: ["aws-cost-exporter:9202"]

  # The LAN, probed through the blackbox exporter. The targets are in prometheus/targets/*.local.yml
  # (git-ignored, so no address enters git; the *.example.yml files show the shape). Without a file a job
  # has no targets. Rules: rules/lan.yml.
  - job_name: lan-icmp
    metrics_path: /probe
    params: {module: [icmp]}
    scrape_timeout: 5s
    file_sd_configs:
      - files: [/etc/prometheus/targets/lan-icmp.local.yml]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # DNS servers, asked for a real name. A minute apart keeps the probe's own load on the servers small.
  - job_name: lan-dns
    metrics_path: /probe
    params: {module: [dns_a]}
    scrape_interval: 60s
    scrape_timeout: 5s
    file_sd_configs:
      - files: [/etc/prometheus/targets/lan-dns.local.yml]
    relabel_configs: *blackbox_relabel

  - job_name: lan-services
    metrics_path: /probe
    params: {module: [tcp_connect]}
    scrape_timeout: 5s
    file_sd_configs:
      - files: [/etc/prometheus/targets/lan-services.local.yml]
    relabel_configs: *blackbox_relabel

  # The other Prometheus on the LAN: each stack watches the other.
  - job_name: lan-prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets/lan-prometheus.local.yml]
