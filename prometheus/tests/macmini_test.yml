# promtool test rules prometheus/tests/macmini_test.yml
rule_files:
  - ../rules/macmini.yml

evaluation_interval: 1m

tests:
  # Resident gone for 20 minutes, no battery run: fires. Ollama down: MacMiniOllamaDown only.
  - interval: 1m
    input_series:
      - series: 'ollama_up{job="macmini-ollama"}'
        values: '1x20 0x10'
      - series: 'ollama_resident_loaded{job="macmini-ollama",model="m:latest"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: MacMiniResidentNotLoaded
        exp_alerts:
          - exp_labels: {severity: ticket, area: ai, job: macmini-ollama}
            exp_annotations:
              summary: The resident model has not been loaded on the Mac mini for 15 minutes.
      - eval_time: 30m
        alertname: MacMiniResidentNotLoaded
        exp_alerts: []
      - eval_time: 30m
        alertname: MacMiniOllamaDown
        exp_alerts:
          - exp_labels: {severity: ticket, area: ai, job: macmini-ollama}
            exp_annotations:
              summary: Ollama on the Mac mini does not answer /api/ps.

  # A battery run holds another model: the resident alert stays quiet.
  - interval: 1m
    input_series:
      - series: 'ollama_up{job="macmini-ollama"}'
        values: '1x30'
      - series: 'ollama_resident_loaded{job="macmini-ollama",model="m:latest"}'
        values: '0x30'
      - series: 'battery_run_active{host="macmini",arm="a"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: MacMiniResidentNotLoaded
        exp_alerts: []

  # Pressure warning for 12 minutes fires; 5 minutes does not. Disk at 5% free fires after 30 minutes.
  - interval: 1m
    input_series:
      - series: 'macmon_memory_pressure_level{job="macmini-macmon",chip="c"}'
        values: '2x5 1x5 2x12'
      - series: 'node_filesystem_avail_bytes{job="macmini-node",mountpoint="/System/Volumes/Data"}'
        values: '5x40'
      - series: 'node_filesystem_size_bytes{job="macmini-node",mountpoint="/System/Volumes/Data"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{job="macmini-node",mountpoint="/System/Volumes/VM"}'
        values: '5x40'
      - series: 'node_filesystem_size_bytes{job="macmini-node",mountpoint="/System/Volumes/VM"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: MacMiniMemoryPressure
        exp_alerts: []
      - eval_time: 22m
        alertname: MacMiniMemoryPressure
        exp_alerts:
          - exp_labels: {severity: ticket, area: ai}
            exp_annotations:
              summary: The Mac mini has been under memory pressure (warning or critical) for 10 minutes; models are swapping.
      - eval_time: 35m
        alertname: MacMiniDiskLow
        exp_alerts:
          - exp_labels: {severity: ticket, area: ai, job: macmini-node, mountpoint: /System/Volumes/Data}
            exp_annotations:
              summary: "/System/Volumes/Data on the Mac mini has less than 10% free."
