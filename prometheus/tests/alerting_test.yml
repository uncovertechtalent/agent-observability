# promtool test rules prometheus/tests/alerting_test.yml
rule_files:
  - ../rules/alerting.yml

evaluation_interval: 1m

tests:
  # Watchdog fires from the first evaluation, with no input at all.
  - interval: 1m
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: Always fires. Its pings to the outside heartbeat check stopping means the alerting path is down.
      - eval_time: 3h
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: Always fires. Its pings to the outside heartbeat check stopping means the alerting path is down.

  # The pager stops answering scrapes: a page after 2 minutes. Connected again: quiet.
  - interval: 1m
    input_series:
      - series: 'up{job="pager", instance="pager:9096"}'
        values: '1 0 0 0 0 1'
      - series: 'pager_discord_connected{job="pager", instance="pager:9096"}'
        values: '0x7 1x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: PagerDown
        exp_alerts: []
      - eval_time: 3m
        alertname: PagerDown
        exp_alerts:
          - exp_labels: {severity: page, job: pager, instance: "pager:9096"}
            exp_annotations:
              summary: Prometheus cannot scrape the pager; pages reach neither Discord buttons nor escalation.
      - eval_time: 6m
        alertname: PagerDisconnected
        exp_alerts:
          - exp_labels: {severity: page, job: pager, instance: "pager:9096"}
            exp_annotations:
              summary: The pager runs but is not connected to Discord or has no channels set; pages wait in its database.
      - eval_time: 9m
        alertname: PagerDisconnected
        exp_alerts: []

  # One failed Discord call for an incident: a page for 15 minutes, then quiet.
  - interval: 1m
    input_series:
      - series: 'pager_tick_errors_total{job="pager", instance="pager:9096"}'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: PagerFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: PagerFailing
        exp_alerts:
          - exp_labels: {severity: page, job: pager, instance: "pager:9096"}
            exp_annotations:
              summary: The pager failed Discord calls for at least one incident in the last 15 minutes; see its log.
      - eval_time: 25m
        alertname: PagerFailing
        exp_alerts: []

  # A token that expires 15 days after the start: quiet on day 0, a ticket from day 1.
  - interval: 1h
    input_series:
      - series: 'alert_issues_github_token_expiry_timestamp_seconds{job="alert-issues", instance="alert-issues:9095"}'
        values: '1296000x48'
    alert_rule_test:
      - eval_time: 0h
        alertname: AlertIssuesTokenExpiring
        exp_alerts: []
      - eval_time: 25h
        alertname: AlertIssuesTokenExpiring
        exp_alerts:
          - exp_labels: {severity: ticket, job: alert-issues, instance: "alert-issues:9095"}
            exp_annotations:
              summary: The GitHub token of alert-issues expires within 14 days; create a new one and replace the token file.

  # One Discord notification fails after its retries: a ticket, per integration; the webhook
  # counter stays flat and stays quiet.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="discord",reason="other"}'
        values: '0x10 1x20'
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="other"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels: {severity: ticket, integration: discord}
            exp_annotations:
              summary: "Alertmanager failed to deliver notifications through discord in the last 15 minutes."
      # 15 minutes after the last failure the window is clean again.
      - eval_time: 27m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
