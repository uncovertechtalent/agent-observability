# promtool test rules prometheus/tests/battery_test.yml
rule_files:
  - ../rules/battery.yml

evaluation_interval: 1m

tests:
  # Arm a calls for 20 minutes, then hangs while still active: fires after 30 + 5 minutes of silence.
  # Arm b keeps calling: quiet.
  - interval: 1m
    input_series:
      - series: 'battery_run_active{arm="a",host="h",backend="ollama",model="m"}'
        values: '1x70'
      - series: 'battery_calls_total{arm="a",host="h",backend="ollama",model="m",cell="stance",finish="stop"}'
        values: '0+1x20 20x50'
      - series: 'battery_run_active{arm="b",host="h",backend="ollama",model="m"}'
        values: '1x70'
      - series: 'battery_calls_total{arm="b",host="h",backend="ollama",model="m",cell="stance",finish="stop"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 40m
        alertname: BatteryRunStalled
        exp_alerts: []
      - eval_time: 58m
        alertname: BatteryRunStalled
        exp_alerts:
          - exp_labels: {severity: ticket, area: ai, arm: a, host: h}
            exp_annotations:
              summary: "A stance battery run on h is active but made no call in 30 minutes."

  # Key read once with 4 of 50 left, then no more pushes: fires and keeps firing between runs.
  - interval: 1m
    input_series:
      - series: 'battery_key_remaining_usd{backend="openrouter"}'
        values: '4 _x60'
      - series: 'battery_key_limit_usd{backend="openrouter"}'
        values: '50 _x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: BatteryKeyNearLimit
        exp_alerts:
          - exp_labels: {severity: ticket, area: ai, backend: openrouter}
            exp_annotations:
              summary: "The openrouter key used by the stance battery has less than 10% of its limit left."
