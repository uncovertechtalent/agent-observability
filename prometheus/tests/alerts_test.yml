# promtool test rules prometheus/tests/alerts_test.yml
rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml

evaluation_interval: 30s

tests:
  # 20% of requests fail for an hour at 1 req/s: the fast burn alert fires.
  - interval: 30s
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_request_model="m",error_type=""}'
        values: '0+24x180'
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_request_model="m",error_type="500"}'
        values: '0+6x180'
    alert_rule_test:
      - eval_time: 70m
        alertname: LocalLLMAvailabilityBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: Local LLM is burning its 30-day error budget at 14x or more.

  # Same error ratio at one request per hour: the traffic floor holds the page.
  - interval: 30s
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_request_model="m",error_type=""}'
        values: '0+0.0066x180'
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_request_model="m",error_type="500"}'
        values: '0+0.0017x180'
    alert_rule_test:
      - eval_time: 70m
        alertname: LocalLLMAvailabilityBudgetBurnFast
        exp_alerts: []

  # USD 45 in the trailing hour, split over two models, for 15 minutes: the spend alert fires.
  - interval: 1m
    input_series:
      - series: 'model:claude_code_cost_usd:sum1h{model="a"}'
        values: '30x15'
      - series: 'model:claude_code_cost_usd:sum1h{model="b"}'
        values: '15x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClaudeCodeSpendSpike
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: Claude Code spend is above $40 per hour.

  # USD 35 in the trailing hour: below the threshold, no alert.
  - interval: 1m
    input_series:
      - series: 'model:claude_code_cost_usd:sum1h{model="m"}'
        values: '35x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClaudeCodeSpendSpike
        exp_alerts: []

  # USD 45 for 8 minutes, then back to 30: shorter than the 10-minute hold, no alert.
  - interval: 1m
    input_series:
      - series: 'model:claude_code_cost_usd:sum1h{model="m"}'
        values: '45x7 30x7'
    alert_rule_test:
      - eval_time: 12m
        alertname: ClaudeCodeSpendSpike
        exp_alerts: []

  # SearXNG answers nothing for 5 minutes: page.
  - interval: 30s
    input_series:
      - series: 'searxng_up{job="searxng-exporter"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: SearXNGDown
        exp_alerts:
          - exp_labels: {severity: page, job: searxng-exporter}
            exp_annotations:
              summary: SearXNG does not answer; search.sh fails closed with SEARXNG_DOWN.

  # Laptop asleep: no samples at all. Nothing fires.
  - interval: 30s
    input_series:
      - series: 'searxng_up{job="searxng-exporter"}'
        values: '1 1 _x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SearXNGDown
        exp_alerts: []

  # Brave rate-limited on 10 of 11 calls in 30 minutes: ticket.
  - interval: 1m
    input_series:
      - series: 'searxng_engine_calls_total{engine="brave",status="rate_limited",suspended="true"}'
        values: '0+0.3x45'
      - series: 'searxng_engine_calls_total{engine="brave",status="ok",suspended="false"}'
        values: '0+0.03x45'
    alert_rule_test:
      - eval_time: 45m
        alertname: SearXNGEngineFailing
        exp_alerts:
          - exp_labels: {severity: ticket, engine: brave}
            exp_annotations:
              summary: "brave failed over 80% of its calls in the last 30 minutes (rate limit, block, timeout or error)."

  # Two failed calls and nothing else in 30 minutes: below the traffic floor.
  - interval: 1m
    input_series:
      - series: 'searxng_engine_calls_total{engine="brave",status="rate_limited",suspended="false"}'
        values: '0 0 1 1 2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: SearXNGEngineFailing
        exp_alerts: []

  # Three DEGRADED exits within 15 minutes: ticket. One alone does not fire.
  - interval: 1m
    input_series:
      - series: 'searxng_searches_total{kind="search",cache="miss",outcome="degraded"}'
        values: '0 0 1 1 2 2 3x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: SearXNGDegradedSearches
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: search.sh returned SEARXNG_DEGRADED (no results, engines suspended) 3 or more times in 15 minutes.
  - interval: 1m
    input_series:
      - series: 'searxng_searches_total{kind="search",cache="miss",outcome="degraded"}'
        values: '0 0 1x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: SearXNGDegradedSearches
        exp_alerts: []

  # AWS: forecast above the monthly budget fires; below it stays quiet.
  - interval: 1m
    input_series:
      - series: 'aws_cost_month_forecast_usd'
        values: '120x120'
      - series: 'aws_budget_limit_usd{budget="b",period="MONTHLY",unit="USD"}'
        values: '100x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AWSCostForecastOverBudget
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: AWS month-end forecast is above the monthly budget.
  - interval: 1m
    input_series:
      - series: 'aws_cost_month_forecast_usd'
        values: '90x120'
      - series: 'aws_budget_limit_usd{budget="b",period="MONTHLY",unit="USD"}'
        values: '100x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AWSCostForecastOverBudget
        exp_alerts: []

  # AWS: month to date at 85% of budget fires; at 70% it does not.
  - interval: 1m
    input_series:
      - series: 'aws_cost_mtd_usd'
        values: '85x120'
      - series: 'aws_budget_limit_usd{budget="b",period="MONTHLY",unit="USD"}'
        values: '100x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AWSCostMonthToDateOver80
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: AWS spend this month is above 80% of the monthly budget.
  - interval: 1m
    input_series:
      - series: 'aws_cost_mtd_usd'
        values: '70x120'
      - series: 'aws_budget_limit_usd{budget="b",period="MONTHLY",unit="USD"}'
        values: '100x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AWSCostMonthToDateOver80
        exp_alerts: []

  # AWS: a day at 2.5x the median fires; 1.5x does not; 8x under the USD 1 floor does not.
  - interval: 1m
    input_series:
      - series: 'aws_cost_latest_day_usd'
        values: '5x120'
      - series: 'aws_cost_trailing_median_day_usd'
        values: '2x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AWSCostDailySpike
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: The latest day's AWS spend is more than twice the 28-day median.
  - interval: 1m
    input_series:
      - series: 'aws_cost_latest_day_usd'
        values: '3x120'
      - series: 'aws_cost_trailing_median_day_usd'
        values: '2x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AWSCostDailySpike
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'aws_cost_latest_day_usd'
        values: '0.8x120'
      - series: 'aws_cost_trailing_median_day_usd'
        values: '0.1x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AWSCostDailySpike
        exp_alerts: []

  # AWS exporter: no successful fetch for 14 h fires; a fresh fetch stays quiet;
  # a running exporter that never fetched fires.
  - interval: 1m
    input_series:
      - series: 'aws_cost_exporter_last_success_timestamp_seconds'
        values: '0x900'
    alert_rule_test:
      - eval_time: 14h
        alertname: AWSCostExporterStale
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: The AWS cost exporter is not fetching from AWS (no success in 13 hours, or none since it started).
  - interval: 1m
    input_series:
      - series: 'aws_cost_exporter_last_success_timestamp_seconds'
        values: '0+60x900'
    alert_rule_test:
      - eval_time: 14h
        alertname: AWSCostExporterStale
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="aws-cost-exporter",instance="aws-cost-exporter:9202"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: AWSCostExporterStale
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: The AWS cost exporter is not fetching from AWS (no success in 13 hours, or none since it started).
