# Burn-rate alerts follow the multi-window, multi-burn-rate pattern from the
# Google SRE Workbook, chapter 5. SLO targets: availability 99%, latency 95%.
# A homelab sees little traffic, so each alert also requires a minimum request
# rate; without it one failed request in a quiet hour pages.
groups:
  - name: gen_ai_local_slo
    rules:
      - alert: LocalLLMAvailabilityBudgetBurnFast
        expr: |
          sli:gen_ai_availability_errors:ratio_rate1h > (14.4 * 0.01)
          and sli:gen_ai_availability_errors:ratio_rate5m > (14.4 * 0.01)
          and sum(rate(gen_ai_client_operation_duration_seconds_count[1h])) > 1/600
        labels: {severity: page}
        annotations:
          summary: Local LLM is burning its 30-day error budget at 14x or more.
      - alert: LocalLLMAvailabilityBudgetBurnSlow
        expr: |
          sli:gen_ai_availability_errors:ratio_rate6h > (6 * 0.01)
          and sli:gen_ai_availability_errors:ratio_rate30m > (6 * 0.01)
          and sum(rate(gen_ai_client_operation_duration_seconds_count[6h])) > 1/1800
        labels: {severity: ticket}
        annotations:
          summary: Local LLM is burning its 30-day error budget at 6x or more.
      - alert: LocalLLMLatencyBudgetBurnFast
        expr: |
          sli:gen_ai_ttft_slow:ratio_rate1h > (14.4 * 0.05)
          and sli:gen_ai_ttft_slow:ratio_rate5m > (14.4 * 0.05)
        labels: {severity: page}
        annotations:
          summary: Over 72% of streamed chat requests wait more than 4 s for the first token.

  - name: gen_ai_local_symptoms
    rules:
      - alert: OllamaDown
        expr: ollama_up == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: The exporter cannot reach Ollama's /api/ps.
      - alert: OllamaExporterDown
        expr: up{job="ollama-exporter"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: Prometheus cannot scrape the Ollama metering proxy.
      - alert: ModelSpilledToCPU
        expr: ollama_loaded_model_info{processor!="gpu"} == 1 and on() sum(ollama_requests_in_flight) > 0
        for: 5m
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.model }} is serving from {{ $labels.processor }}; expect slow decode."

  - name: claude_code_spend
    rules:
      # model:claude_code_cost_usd:sum1h comes from Loki's ruler (cost of the
      # api_request events in the trailing hour), remote-written to Prometheus.
      # Threshold from 2026-10-02..10-08 in Loki: median active hour USD 10.59,
      # p99 of the trailing hour USD 47.71, busiest hour USD 87.41. At USD 40 the
      # alert fires on busy parallel-session hours, about every other day.
      - alert: ClaudeCodeSpendSpike
        expr: sum(model:claude_code_cost_usd:sum1h) > 40
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Claude Code spend is above $40 per hour.

  # SearXNG, the house search engine. Its exporter pushes from the laptop that runs it, so
  # a sleeping laptop leaves gaps, not zeros: the rules read pushed values and rates with a
  # traffic floor, never up{} or absent().
  - name: searxng
    rules:
      - alert: SearXNGDown
        expr: searxng_up == 0
        for: 3m
        labels: {severity: page}
        annotations:
          summary: SearXNG does not answer; search.sh fails closed with SEARXNG_DOWN.
      - alert: SearXNGProxyEgressDown
        expr: searxng_proxy_up == 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: The proxy egress fails or exits from the wrong IP; the proxied engines return nothing.
      - alert: SearXNGTunnelDown
        expr: node_systemd_unit_state{name="aws-socks.service", state="active"} == 0
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: The SSH tunnel behind the proxy egress is not active on the home server.
      - alert: SearXNGEngineFailing
        expr: |
          sum by (engine) (increase(searxng_engine_calls_total{status=~"rate_limited|blocked|timeout|error"}[30m]))
          / sum by (engine) (increase(searxng_engine_calls_total[30m])) > 0.8
          and sum by (engine) (increase(searxng_engine_calls_total[30m])) >= 5
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.engine }} failed over 80% of its calls in the last 30 minutes (rate limit, block, timeout or error)."
      - alert: SearXNGDegradedSearches
        expr: sum(increase(searxng_searches_total{kind="search", outcome="degraded"}[15m])) >= 3
        labels: {severity: ticket}
        annotations:
          summary: search.sh returned SEARXNG_DEGRADED (no results, engines suspended) 3 or more times in 15 minutes.
      - alert: SearXNGSlowSearches
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(searxng_search_duration_seconds_bucket[30m]))) > 8
          and on() sum(rate(searxng_search_duration_seconds_count[30m])) > 1/300
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: 95th percentile search latency is above 8 s; an engine is hanging until its timeout.
