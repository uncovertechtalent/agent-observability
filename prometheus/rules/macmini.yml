# The Mac mini LLM box (README, "The Mac mini LLM box"): node_exporter and macmon on the box, and its Ollama
# through ollama-exporter-macmini. Scrape failures of these jobs are ScrapeTargetDown (lan.yml); ping, LM Studio
# and the OpenCode web UI are probes in the lan-icmp and lan-services target files (LANHostDown, LANServiceDown).
# The box is a sandbox, so everything here is a ticket, filed under area:ai.
groups:
  - name: macmini
    rules:
      - alert: MacMiniOllamaDown
        expr: ollama_up{job="macmini-ollama"} == 0
        for: 3m
        labels: {severity: ticket, area: ai}
        annotations:
          summary: Ollama on the Mac mini does not answer /api/ps.

      # The supervisor on the box reloads the resident within a minute of an eviction. A battery run may hold
      # another model for its whole run (battery_run_active, pushed by client/battery), so a run mutes this.
      # Contract with the pusher (client/battery, PR 23): OTLP through Alloy, `host` as a data point attribute
      # (not host.name, which becomes host_name), no unit (a unit adds a suffix such as _ratio to the name), pushed
      # at least every 5 minutes for the whole run (the driver sends every 30 s). A gauge older than 5 minutes is stale and no longer mutes.
      - alert: MacMiniResidentNotLoaded
        # The model label is dropped: board issues are public, and the resident's name stays on the dashboard.
        expr: |
          max without (model) (ollama_resident_loaded{job="macmini-ollama"}) == 0
          and on() ollama_up{job="macmini-ollama"} == 1
          unless on() max(battery_run_active{host="macmini"}) == 1
        for: 15m
        labels: {severity: ticket, area: ai}
        annotations:
          summary: The resident model has not been loaded on the Mac mini for 15 minutes.

      # macOS memory pressure (kern.memorystatus_vm_pressure_level): 1 normal, 2 warning, 4 critical.
      # Warning is normal for a few minutes while a large model loads; held for 10 minutes it means swapping.
      - alert: MacMiniMemoryPressure
        expr: max(macmon_memory_pressure_level{job="macmini-macmon"}) >= 2
        for: 10m
        labels: {severity: ticket, area: ai}
        annotations:
          summary: The Mac mini has been under memory pressure (warning or critical) for 10 minutes; models are swapping.

      - alert: MacMiniDiskLow
        expr: |
          node_filesystem_avail_bytes{job="macmini-node", mountpoint=~"/System/Volumes/Data|/Volumes/.+"}
          / node_filesystem_size_bytes{job="macmini-node", mountpoint=~"/System/Volumes/Data|/Volumes/.+"} < 0.10
        for: 30m
        labels: {severity: ticket, area: ai}
        annotations:
          summary: A data volume on the Mac mini has less than 10% free (the mountpoint label and the dashboard say which).
