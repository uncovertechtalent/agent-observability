# The alerting path itself. Watchdog always fires; Alertmanager sends it to the pager, which pings an
# outside heartbeat check every 5 minutes with an empty request, and the check alarms when the pings
# stop. A dead Prometheus, Alertmanager, pager, box or uplink all stop them, and none of those can
# report itself.
# Severity "none" keeps it off every route to a person. The NAS Prometheus carries the same rule.
groups:
  - name: alerting
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: Always fires. Its pings to the outside heartbeat check stopping means the alerting path is down.

      # The pager service. Both go to #watchdog by webhook, past the pager (alertmanager.yml).
      - alert: PagerDown
        expr: up{job="pager"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: Prometheus cannot scrape the pager; pages reach neither Discord buttons nor escalation.
      - alert: PagerFailing
        expr: increase(pager_tick_errors_total[15m]) > 0
        labels: {severity: page}
        annotations:
          summary: The pager failed Discord calls for at least one incident in the last 15 minutes; see its log.
      - alert: PagerDisconnected
        expr: pager_discord_connected == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: The pager runs but is not connected to Discord or has no channels set; pages wait in its database.

      # The GitHub token behind the board issues expires on a date; a ticket two weeks before, while it still works.
      - alert: AlertIssuesTokenExpiring
        expr: alert_issues_github_token_expiry_timestamp_seconds - time() < 14 * 86400
        labels: {severity: ticket}
        annotations:
          summary: The GitHub token of alert-issues expires within 14 days; create a new one and replace the token file.

      # Notifications Alertmanager gave up on after its retries. A failing pager, Discord or
      # heartbeat webhook reaches #watchdog and the board this way.
      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Alertmanager failed to deliver notifications through {{ $labels.integration }} in the last 15 minutes."
