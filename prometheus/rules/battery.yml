# The stance battery (client/battery/battery.py) pushes OTLP metrics through Alloy while a run is going:
# battery_run_active, battery_calls_total, battery_tokens_total, battery_cost_usd_total, decode speed,
# and for OpenRouter the key's limit, usage and remaining credit. Between runs nothing is pushed, so these
# rules read pushed values only, never up{} or absent(). Decode speed is on the dashboard and not alerted:
# it depends on the model and the backend (a 122B model on the CPU decodes at 2 to 3 tokens per second by design).
groups:
  - name: battery
    rules:
      # A run says it is active but has made no call for 30 minutes: a hung backend or a stuck request.
      # The longest single call so far (thinking on, 8,192 tokens) took under 10 minutes.
      - alert: BatteryRunStalled
        expr: |
          max by (arm, host) (battery_run_active) == 1
          unless on (arm, host) sum by (arm, host) (increase(battery_calls_total[30m])) > 0
        for: 5m
        labels: {severity: ticket, area: ai}
        annotations:
          summary: "Battery arm {{ $labels.arm }} on {{ $labels.host }} is active but made no call in 30 minutes."

      # Under 10% of the hosted key's credit left. Read at the start, every 20 calls and the end of a run,
      # so the value holds between runs (last_over_time over a week).
      - alert: BatteryKeyNearLimit
        expr: |
          max by (backend) (last_over_time(battery_key_remaining_usd[7d]))
          / max by (backend) (last_over_time(battery_key_limit_usd[7d])) < 0.10
        labels: {severity: ticket, area: ai}
        annotations:
          summary: "The {{ $labels.backend }} key used by the stance battery has less than 10% of its limit left."
