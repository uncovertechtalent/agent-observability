# Agent and LLM observability stack: Alloy -> Prometheus / Loki / Tempo -> Grafana.
# Runs on one host next to Ollama. See README.md for the data flow.

services:
  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # Alloy UI
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-90d}
      - --web.enable-otlp-receiver          # Alloy pushes OTLP metrics here
      - --web.enable-remote-write-receiver  # Tempo span metrics land here
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    depends_on: [prometheus]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # LAN viewers need no login. Only the public reverse proxy's allowed paths reach this box from outside.
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # Public dashboards are framed on machinebehavior.io/inside/. Only the public paths pass the
      # public reverse proxy, so the login and admin pages stay unreachable from outside either way.
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  ollama-exporter:
    build: ./ollama-exporter
    environment:
      - OLLAMA_UPSTREAM=${OLLAMA_UPSTREAM:-http://host.docker.internal:11434}
    ports:
      # Clients that use this port are metered. Default 11435 sits next to Ollama on
      # 11434. To meter every client without editing them, move Ollama to another
      # port and set OLLAMA_PROXY_PORT=11434 (see README, "Transparent mode").
      - "${OLLAMA_PROXY_PORT:-11435}:11435"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Reads the GitHub Actions deploy runs of the three websites and the sites' public
  # JSON; writes run history to Loki and serves the latest state on :9201.
  deploy-exporter:
    build: ./deploy-exporter
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}   # read access to the repos and their Actions; private repos need it
      - GITHUB_TOKEN_UNCOVERTECHTALENT_GIT=${GITHUB_TOKEN_UNCOVERTECHTALENT_GIT:-}   # repos of the uncovertechtalent-git organisation (a fine-grained token covers one owner)
      - GITHUB_TOKEN_OWNER=${GITHUB_TOKEN_OWNER:-uncovertechtalent}   # owner covered by GITHUB_TOKEN; each other owner needs its own line above
      - LOKI_URL=http://loki:3100
    volumes:
      - deploy_exporter_data:/data
    ports:
      - "9201:9201"
    depends_on: [loki]
    restart: unless-stopped

  # AWS spend from Cost Explorer and AWS Budgets. The host's AWS shared config is mounted
  # read-only and never leaves the host; no port is published, only Prometheus scrapes it.
  aws-cost-exporter:
    build:
      context: ./aws-cost-exporter
      args: {UID: "${AWS_CONFIG_UID:-1000}", GID: "${AWS_CONFIG_GID:-1000}"}
    environment:
      - AWS_PROFILE=${AWS_COST_PROFILE:-default}
      - AWS_SHARED_CREDENTIALS_FILE=/aws/credentials
      - AWS_CONFIG_FILE=/aws/config
    volumes:
      - ${HOME}/.aws:/aws:ro
      - aws_cost_exporter_data:/data
    expose: ["9202"]
    restart: unless-stopped

  # Routes the alerts of this stack's Prometheus and of the NAS monitoring Prometheus by
  # severity: page to Discord in waking hours, page and ticket to a GitHub issue, info nowhere,
  # Watchdog to the outside heartbeat checks. Every endpoint needs basic auth (secrets/web.yml),
  # since a posted alert can end up as a public issue. Secrets are files in
  # ./alertmanager/secrets (mode 600, git-ignored), so the container runs as the host user that
  # owns them; state (silences, the notification log) goes to ./alertmanager/data.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    user: "${ALERTMANAGER_UID:-1000}:${ALERTMANAGER_GID:-1000}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
      - --web.config.file=/etc/alertmanager/secrets/web.yml
      - --cluster.listen-address=   # one instance, no gossip port
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./alertmanager/data:/alertmanager
    ports:
      - "9093:9093"   # the NAS Prometheus sends its alerts here over the LAN
    depends_on: [alert-issues]
    restart: unless-stopped

  # Alertmanager's ticket receiver: opens or updates one GitHub issue per alert on the board
  # repository. Compose network only. The token is a file in ./alert-issues/secrets (mode 600):
  # fine-grained, that one repository, Issues read and write.
  alert-issues:
    build:
      context: ./alert-issues
      args: {UID: "${ALERTMANAGER_UID:-1000}", GID: "${ALERTMANAGER_GID:-1000}"}
    environment:
      - GITHUB_REPO=${ALERT_ISSUES_REPO:-uncovertechtalent/machinebehavior.io}
      - GITHUB_TOKEN_FILE=/secrets/github_token
    volumes:
      - ./alert-issues/secrets:/secrets:ro
      - alert_issues_data:/data
    expose: ["9095"]
    restart: unless-stopped

volumes:
  alloy_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  deploy_exporter_data:
  aws_cost_exporter_data:
  alert_issues_data:
